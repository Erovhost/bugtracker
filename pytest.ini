[pytest]
# Где искать тесты
testpaths = tests
# Корень проекта в путях поиска модулей: в тестах работает import config, import app
pythonpath = .
# e2e-тесты (Playwright) запускаются в установленном Microsoft Edge —
# отдельно скачивать браузеры не нужно. Для Chrome:
#   pytest --browser-channel chrome   (значение из командной строки главнее)
addopts = --browser-channel msedge
# Маркеры: быстрый прогон без браузера — pytest -m "not e2e"
markers =
    e2e: сквозные тесты в настоящем браузере (Playwright), медленнее остальных
