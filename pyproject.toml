# Настройки инструментов проекта

[tool.ruff]
# Максимальная длина строки кода
line-length = 100
# Миграции сгенерированы Alembic — их стиль не проверяем
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E, W — стиль PEP 8; F — ошибки (неиспользуемые импорты, неопределённые имена);
# I — порядок импортов; B — вероятные баги (flake8-bugbear)
select = ["E", "W", "F", "I", "B"]
